name: ci

on:
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/ -q

  data-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # DVC pull needs credentials; the committed fixture stands in for the
      # DVC-tracked dataset so this job never needs a secret.
      - run: uv run python -m ml_skyline.data_checks --sample tests/fixtures/sample.csv

  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m ml_skyline.smoke --rows 300 --data tests/fixtures/sample.csv

  # Bonus (+5): CML posts the smoke-train metrics table as a PR comment.
  # Not a required status check, and skipped on fork PRs (read-only token),
  # so it can never block a merge on its own.
  cml-comment:
    runs-on: ubuntu-latest
    needs: [lint, tests, data-checks, smoke-train]
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: iterative/setup-cml@v2
      - run: uv sync --frozen
      - name: Build the metrics report
        run: uv run python -m ml_skyline.smoke --rows 300 --data tests/fixtures/sample.csv --report cml-report.md
      - name: Publish metrics table as a PR comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create cml-report.md --pr
